; BlindVision Smart Stick firmware
; Target: ESP32 DevKit V1 (dual-core Xtensa LX6 @ 240 MHz) - Section III
;
; Core 0: polls sensors at ~10-20 Hz, applies local safety logic
; Core 1: manages the BLE stack and state machine

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    ESP32 BLE Arduino
    adafruit/Adafruit MPU6050 @ ^2.2.6      ; MPU9250 register-compatible base driver
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
    -D CORE_DEBUG_LEVEL=2
build_src_filter =
    +<*>
    -<selftest/>

; Flash this environment FIRST, before esp32dev, on any new/rewired
; board: `pio run -e esp32dev_selftest -t upload -t monitor`.
; Exercises every pin in include/pins.h with live Serial feedback so
; wiring is verified before trusting main.cpp's sensor fusion output.
; See src/selftest/selftest_main.cpp.
[env:esp32dev_selftest]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit MPU6050 @ ^2.2.6
    adafruit/Adafruit Unified Sensor @ ^1.1.14
build_flags =
    -D CORE_DEBUG_LEVEL=2
build_src_filter =
    +<selftest/>
    +<sensors.cpp>
    -<main.cpp>
    -<ble_server.cpp>
