# BlindVision detection dataset config (Ultralytics YOLO format).
#
# Matches the 10-class scheme reported in Table II / Table V of the
# manuscript: person, door, chair, backpack, laptop, bottle, pole,
# vehicle, bicycle, stairs.
#
# This repo does NOT include the manuscript's own labeled images (the
# authors' dataset is not yet public per Section V.D / Data
# Availability). Point `path`/`train`/`val`/`test` at your own
# YOLO-format dataset with this same class list and ordering before
# running training/scripts/train.py.
#
# Expected directory layout (standard Ultralytics YOLO layout):
#   <path>/images/train/*.jpg  <path>/labels/train/*.txt
#   <path>/images/val/*.jpg    <path>/labels/val/*.txt
#   <path>/images/test/*.jpg   <path>/labels/test/*.txt
# where each .txt has one row per object: `class_id x_center y_center width height`
# (normalized 0-1, standard YOLO format).

path: ../data/blindvision_detect   # relative to this file; override with --data on the CLI
train: images/train
val: images/val
test: images/test

names:
  0: person
  1: door
  2: chair
  3: backpack
  4: laptop
  5: bottle
  6: pole
  7: vehicle
  8: bicycle
  9: stairs

# Reference dataset composition to reproduce (Table II). Your own
# collection does not need to match these counts exactly, but the
# split ratios and class balance are a reasonable target if you are
# trying to reproduce Table III's reported metrics.
#   train: 5600 images
#   val:    700 images
#   test:   700 images (842 annotated objects, ~1.20 objects/image)
